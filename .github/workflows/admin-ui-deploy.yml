name: Deploy admin-ui

on:
  push:
    branches: [main, master]
    paths: ["admin-ui/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Build (static output only — no server runtime)
        working-directory: admin-ui
        run: npm run build
        env:
          # Set ADMIN_API_BASE_URL as a repository/environment variable pointing at the
          # deployed admin-api Worker URL — this is a public URL, not a secret.
          VITE_ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin-ui
          command: pages deploy dist --project-name=library-admin-ui
